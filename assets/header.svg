<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CF7FF"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CF7FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7CF7FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CF7FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7CF7FF"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7CF7FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="18"/></clipPath>
    <clipPath id="l1"><rect x="676" y="100" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="676" y="130" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="1.1s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="676" y="165" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="1.5s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="676" y="190" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="2.3s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="676" y="225" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="2.7s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="676" y="250" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="3.8s" dur="0.01s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- fondo -->
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="340" fill="url(#dots)" opacity="0.6"/>
    <circle cx="180" cy="80" r="260" fill="url(#glowA)"/>
    <circle cx="1020" cy="300" r="280" fill="url(#glowB)"/>

    <!-- estelas de velocidad -->
    <g stroke="url(#streak)" stroke-linecap="round">
      <line x1="0" y1="70" x2="180" y2="70" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1400 0" dur="3.2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="292" x2="120" y2="292" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1400 0" dur="4.1s" begin="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="318" x2="240" y2="318" stroke-width="1">
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="1400 0" dur="5.3s" begin="0.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- lado izquierdo -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
      <text x="62" y="112" font-size="15" fill="#8b949e">// hola mundo, soy</text>
    </g>
    <text x="58" y="182" font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Minato Dev</text>
    <text x="62" y="222" font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#c9d1d9">Full Stack Developer <tspan fill="#484f58">·</tspan> Web &amp; Mobile</text>

    <g font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600">
      <rect x="62" y="248" width="152" height="30" rx="15" fill="#7CF7FF" fill-opacity="0.08" stroke="#7CF7FF" stroke-opacity="0.45"/>
      <text x="138" y="268" text-anchor="middle" fill="#7CF7FF">Clean Architecture</text>
      <rect x="224" y="248" width="128" height="30" rx="15" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="288" y="268" text-anchor="middle" fill="#A78BFA">Secure Systems</text>
      <rect x="362" y="248" width="138" height="30" rx="15" fill="#F472B6" fill-opacity="0.08" stroke="#F472B6" stroke-opacity="0.45"/>
      <text x="431" y="268" text-anchor="middle" fill="#F472B6">Anime-minimal UI</text>
    </g>

    <!-- terminal -->
    <rect x="650" y="46" width="500" height="250" rx="12" fill="#161b22" stroke="#30363d"/>
    <path d="M650 82 H1150" stroke="#30363d"/>
    <circle cx="672" cy="64" r="6" fill="#ff5f57"/>
    <circle cx="692" cy="64" r="6" fill="#febc2e"/>
    <circle cx="712" cy="64" r="6" fill="#28c840"/>
    <text x="900" y="69" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#6e7681">minato@dev: ~</text>

    <g font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="16">
      <text x="676" y="120" clip-path="url(#l1)"><tspan fill="#7CF7FF">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="694" y="146" clip-path="url(#l2)" fill="#8b949e">minato — full stack developer</text>
      <text x="676" y="182" clip-path="url(#l3)"><tspan fill="#7CF7FF">$</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
      <text x="694" y="208" clip-path="url(#l4)" fill="#8b949e">node · python · angular · ionic</text>
      <text x="676" y="244" clip-path="url(#l5)"><tspan fill="#7CF7FF">$</tspan><tspan fill="#e6edf3"> git push origin main</tspan></text>
      <text x="694" y="270" clip-path="url(#l6)"><tspan fill="#3fb950">✓</tspan><tspan fill="#8b949e"> deployed, sin warnings</tspan></text>
      <rect x="932" y="256" width="9" height="18" fill="#7CF7FF" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.01;0.02;0.5;0.51" dur="1s" begin="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- línea de acento inferior -->
    <rect x="0" y="336" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#30363d"/>
</svg>
